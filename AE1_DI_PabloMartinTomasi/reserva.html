<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="css/style.css" rel="stylesheet">
    <title>Reserva</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-secondary bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><img class="logo" src="img/logoAgencia.jpg" alt="Logo"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="destino.html">Destinos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="ofertas.html">Ofertas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reserva.html">Reservas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!--Titulo de las ofertas-->
            <div class="col-md-12">
                <h2 class="tituloReserva"><br>Reservar<br><br></h2>
            </div>
            <div class="col-md-12">
                <div class="d-flex justify-content-center">
                    <div class="card cardFormulario">
                        <div class="card-body">
                            <form>
                                <div class="mb-3">
                                    <label for="text" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Nombre" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Destino</label>
                                    <select class="form-select" aria-label="Default select example">
                                        <option value=""></option>
                                        <option value="Paris">París</option>
                                        <option value="Roma">Roma</option>
                                        <option value="Nueva York">Nueva York</option>
                                        <option value="Lanzarote">Lanzarote</option>
                                        <option value="CruceroCaribe">Crucero Caribe</option>
                                        <option value="hauteGaronne">Haute Garonne</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="date" class="form-label">Fecha</label>
                                    <input type="date" class="form-control" id="fchaReserva" required>
                                </div>
                                <div class="text-center mb-3">
                                    <button type="submit" class="btn btn-primary rounded-pill px-4">Reservar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <br><br>

    <div class="footer">
        <hr>
        <p class="textoFooter">
            Derechos de Pablo Martin Tomasi
        </p>
    </div>
</body>

</html>
