<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="css/estilo.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <title>Indicadores</title>
</head>

<body>
    <h2>Totales y Estadísticas</h2>
    <div id="estadisticas" class="mb-3"></div>

    <h2>Gráfico de Indicadores por Categoría</h2>
    <canvas id="grafico"></canvas>

    <script>
    const apiUrl = 'http://localhost:8081/indicadores/todos';
    let graficoInstance = null;

    function calcularEstadisticas(lista) {
        const conteoPorTipo = {};
        const sumaValores = {};
        const conteoValores = {};

        lista.forEach(ind => {
            conteoPorTipo[ind.tipo] = (conteoPorTipo[ind.tipo] || 0) + 1;
            const valorNum = parseFloat(ind.valor);
            if (!isNaN(valorNum)) {
                sumaValores[ind.tipo] = (sumaValores[ind.tipo] || 0) + valorNum;
                conteoValores[ind.tipo] = (conteoValores[ind.tipo] || 0) + 1;
            }
        });

        let html = '<ul>';
        for (const tipo in conteoPorTipo) {
            const total = sumaValores[tipo] || '-';
            const media = conteoValores[tipo] ? (sumaValores[tipo] / conteoValores[tipo]).toFixed(2) : '-';
            html += `<li><span>${tipo}</span><span>Recuento: ${conteoPorTipo[tipo]} | Total: ${total} | Media: ${media}</span></li>`;
        }
        html += '</ul>';

        document.getElementById('estadisticas').innerHTML = html;
    }

    function graficar(lista) {
        const categorias = [...new Set(lista.map(ind => ind.categoria))];
        const conteo = categorias.map(cat => lista.filter(ind => ind.categoria === cat).length);

        // Generar colores aleatorios para cada categoría
        const colores = categorias.map(() => `hsl(${Math.floor(Math.random() * 360)}, 70%, 60%)`);

        const ctx = document.getElementById('grafico').getContext('2d');

        if (graficoInstance) graficoInstance.destroy();

        graficoInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: categorias,
                datasets: [{
                    data: conteo,
                    backgroundColor: colores,
                    borderColor: '#fff',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: {
                            boxWidth: 20,
                            padding: 15
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.raw;
                                return `${label}: ${value}`;
                            }
                        }
                    }
                }
            }
        });
    }

    async function cargarDatos() {
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('Error al obtener los datos');
            const datos = await response.json();

            calcularEstadisticas(datos);
            graficar(datos);
        } catch (error) {
            console.error(error);
            document.getElementById('estadisticas').innerHTML = 'Error cargando los datos';
        }
    }

    cargarDatos();
</script>

</body>

</html>
