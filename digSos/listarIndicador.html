<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="css/estilo.css" rel="stylesheet">
    <title>Indicadores</title>
</head>

<body>
    <!-- barra de navegacion -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <img src="img/Logo.png" class="mt-4" alt="Logo EcoData Solutions" width="150" height="50"><!-- logo de la web -->

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Index</a><!-- pantalla de index -->
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="listarIndicador.html">Indicadores</a><!-- pantalla de lista de los indicadores -->
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <h1 class="centrarTitulo">Listado de indicadores</h1><br>

    <!-- control de los filtro, en mi caso los filtros son de tipo y de ámbito -->
    <div class="container mb-3">
        <div class="row justify-content-center align-items-end">
            <div class="col-md-4">
                <label for="filtroTipo" class="form-label">Filtrar por tipo</label>
                <select id="filtroTipo" class="form-select" onchange="filtros()">
                    <option value="">Todos</option>
                    <option value="Digitalización">Digitalización</option>
                    <option value="Sostenibilidad">Sostenibilidad</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="filtroAmbito" class="form-label">Filtrar por ámbito</label>
                <select id="filtroAmbito" class="form-select" onchange="filtros()">
                    <option value="">Todos</option>
                    <option value="Empresa">Empresa</option>
                    <option value="Departamento">Departamento</option>
                    <option value="Proceso">Proceso</option>
                    <option value="Servicio">Servicio</option>
                </select>
            </div>
        </div>
    </div>


    <!-- boton para que manda al usuario a otra pantalla para poder agregar un nuevo indicador -->
    <a href="agregarIndicador.html" class="btn btn-primary" id="agregarIndicador">Agregar Indicador</a>

    <!-- tabla para poder lista todos los indicadores -->
    <table id="indicadores-table">
        <thead>
            <tr>
                <th scope="col">Informe</th>
                <th scope="col">ID</th>
                <th scope="col">Tipo</th>
                <th scope="col">Categoria</th>
                <th scope="col">Nombre</th>
                <th scope="col">Descripcion</th>
                <th scope="col">Valor</th>
                <th scope="col">Unidad</th>
                <th scope="col">Fecha</th>
                <th scope="col">Ambito</th>
                <th scope="col">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Filas generadas por JavaScript -->
        </tbody>
    </table>
    <br><br>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const apiUrl = 'http://localhost:8081/indicadores/todos';

        let indicadoresGlobal = [];

        //funcion de cargar todos los indicadores
        function cargarIndicadores() {
            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error al obtener los datos');
                    }
                    return response.json();
                })
                .then(indicadores => {
                    indicadoresGlobal = indicadores;
                    mostrarIndicadores(indicadoresGlobal);
                })
                .catch(error => console.error('Error:', error));
        }

        //funcion de mostrar todos los indicadores
        function mostrarIndicadores(lista) {
            const tbody = document.querySelector('#indicadores-table tbody');
            tbody.innerHTML = "";

            lista.forEach(indicador => {
                const fila = document.createElement('tr');
                //aqui se imprime cada uno de los indicadores, ademas de un boton para poder ver el informe de un indicador y al final 2 botones para poder editar y eliminar un indicador
                fila.innerHTML = `
                <td>
                    <button class="btn btn-link p-0" onclick="verInformeIncidador(${indicador.id})">
                        <img src="img/Libro.png" alt="Informe" width="20" height="20">
                    </button>
                </td>
                <td>${indicador.id}</td>
                <td>${indicador.tipo}</td>
                <td>${indicador.categoria}</td>
                <td>${indicador.nombre}</td>
                <td>${indicador.descripcion}</td>
                <td>${indicador.valor}</td>
                <td>${indicador.unidad}</td>
                <td>${indicador.fecha}</td>
                <td>${indicador.ambito}</td>
                <td class="d-flex justify-content-center gap-2">
                    <button class="btn btn-link p-0" onclick="modificarIndicador(${indicador.id})">
                        <img src="img/Modificar.png" alt="Modificar" width="20" height="20">
                    </button>
                    <button class="btn btn-link p-0" onclick="eliminarIndicador(${indicador.id})">
                        <img src="img/Eliminar.png" alt="Eliminar" width="20" height="20">
                    </button>
                </td>
            `;
                tbody.appendChild(fila);
            });
        }

        //funcion que envia al usuario, a una ventana externa para poder ver el informe de el indicador que haya selcionado
        function verInformeIncidador(id) {
            window.location.href = "informeIndicador.html?id=" + id;
        }

        //funcion para poder enviar al usuario, a una ventana que le permita modificar los datos de un indicador
        function modificarIndicador(id) {
            window.location.href = "actualizarIndicador.html?id=" + id;
        }

        //funcion para eliminar un indicador
        function eliminarIndicador(id) {
            if (confirm("¿Estás seguro de que deseas eliminar este indicador?")) {//mensaje para poder confirma de que se puede eliminar el indicador
                fetch(`http://localhost:8081/indicadores/eliminar/${id}`, { //sentencia para poder eliminar el indicador con el id selecionado en un principio
                    method: 'DELETE'
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error("Error al eliminar el indicador");
                        }
                        alert("Indicador eliminado correctamente");//mensaje para confirmar de que se ha eliminado el indicador de forma correcta
                        cargarIndicadores();
                    })
                    .catch(error => {
                        console.error(error);
                        alert("No se ha podido eliminar el indicador");
                    });
            }
        }

        //funcion de los filtros
        function filtros() {
            const tipo = document.getElementById('filtroTipo').value;
            const ambito = document.getElementById('filtroAmbito').value;

            const filtrados = indicadoresGlobal.filter(indicador => {
                return (tipo === "" || indicador.tipo === tipo) &&
                    (ambito === "" || indicador.ambito === ambito);
            });

            mostrarIndicadores(filtrados);
        }

        cargarIndicadores();
    </script>



</body>

</footer>

</html>
