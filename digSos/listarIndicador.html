<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="css/estilo.css" rel="stylesheet">
    <title>Indicadores</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">EcoData Solution S.L</a>

            <!-- Botón hamburguesa -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item active">
                        <a class="nav-link" href="index.html">Index</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="listarIndicador.html">Indicadores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="informesIndicadores.html">Informe</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <h1 class="centrarTitulo">Listado de indicadores</h1>
    <a href="agregarIndicador.html" class="btn btn-primary">Agregar Indicador</a>

    <table id="indicadores-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tipo</th>
                <th>Categoria</th>
                <th>Nombre</th>
                <th>Descripcion</th>
                <th>Valor</th>
                <th>Unidad</th>
                <th>Fecha</th>
                <th>Ambito</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Filas generadas por JavaScript -->
        </tbody>
    </table>


    <script>
        const apiUrl = 'http://localhost:8081/indicadores/todos';

        // Función para mostrar los indicadores
        function cargarIndicadores() {
            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Error al obtener los datos de la API');
                    return response.json();
                })
                .then(indicadores => {
                    const tbody = document.querySelector('#indicadores-table tbody');
                    tbody.innerHTML = "";

                    indicadores.forEach(indicador => {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `
                    <td>${indicador.id}</td>
                    <td>${indicador.tipo}</td>
                    <td>${indicador.categoria}</td>
                    <td>${indicador.nombre}</td>
                    <td>${indicador.descripcion}</td>
                    <td>${indicador.valor}</td>
                    <td>${indicador.unidad}</td>
                    <td>${indicador.fecha}</td>
                    <td>${indicador.ambito}</td>
                    <td>
                        <button class="btn btn-primary" onclick="modificarIndicador(${indicador.id})">Modificar</button>
                        <button class="btn btn-danger" onclick="eliminarIndicador(${indicador.id})">Eliminar</button>
                    </td>
                `;
                        tbody.appendChild(fila);
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        function modificarIndicador(id) {
            window.location.href = "actualizarIndicador.html?id=" + id;
        }
        cargarIndicadores();
    </script>


</body>
