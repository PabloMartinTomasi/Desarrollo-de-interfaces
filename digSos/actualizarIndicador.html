<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="css/estilo.css" rel="stylesheet">
    <title>Modificar Indicador</title>
</head>

<body>
    <main class="d-flex flex-column justify-content-center align-items-center py-5">
        <div class="card shadow-lg p-4 rounded-4 w-100" style="max-width: 500px; background-color: #ffffff;">
            <h1 class="text-center mb-4 text-success fw-bold">Modificar Indicador</h1>

            <form id="indicadorForm">
                <!-- ID -->
                <div class="mb-3">
                    <label for="id" class="form-label">ID</label>
                    <input type="text" id="id" name="id" class="form-control" placeholder="ID del indicador" readonly>
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label">Tipo</label>
                    <input type="text" id="tipo" name="tipo" class="form-control" placeholder="Tipo de indicador" required>
                </div>

                <div class="mb-3">
                    <label for="categoria" class="form-label">Categoría</label>
                    <input type="text" id="categoria" name="categoria" class="form-control" placeholder="Categoría" required>
                </div>

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Nombre del indicador" required>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea id="descripcion" name="descripcion" class="form-control" placeholder="Descripción del indicador" rows="3" required></textarea>
                </div>

                <!-- Valor y Unidad en la misma línea -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="valor" class="form-label">Valor</label>
                        <input type="text" id="valor" name="valor" class="form-control" placeholder="Valor del indicador" required>
                    </div>
                    <div class="col-md-6">
                        <label for="unidad" class="form-label">Unidad</label>
                        <input type="text" id="unidad" name="unidad" class="form-control" placeholder="Unidad de medida" required>
                    </div>
                </div>

                <!-- Fecha y Ámbito en la misma línea -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="fecha" class="form-label">Fecha</label>
                        <input type="date" id="fecha" name="fecha" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="ambito" class="form-label">Ámbito</label>
                        <input type="text" id="ambito" name="ambito" class="form-control" placeholder="Ámbito del indicador" required>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button type="button" class="btn btn-success w-45" onclick="guardarIndicador()">Guardar</button>
                    <a href="listarIndicador.html" class="btn btn-outline-danger w-45">Volver</a>
                </div>
            </form>

            <div class="message mt-3" id="message"></div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 EcoData Solution S.L. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let indicadorId = null;

        async function init() { 
            const params = new URLSearchParams(window.location.search); 
            indicadorId = params.get('id'); 
            const idInput = document.getElementById('id'); 
            const msg = document.getElementById('message'); 
            
            if (indicadorId) { 
                idInput.value = indicadorId; 
                idInput.readOnly = true; 
                msg.textContent = 'ID recibido.'; 
                msg.style.color = 'green'; } 
                else { 
                    msg.textContent = 'No se recibió ningún ID.'; 
                    msg.style.color = 'red'; 
                } 
            }

        async function guardarIndicador() {
            const form = document.getElementById("indicadorForm");
            const formData = new FormData(form);
            const indicador = {};

            formData.forEach((value, key) => {
                indicador[key] = value;
            });

            try {
                const response = await fetch(`http://localhost:8081/indicadores/editar/${indicadorId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(indicador)
                });

                const msg = document.getElementById("message");
                if (response.ok) {
                    msg.textContent = "Indicador actualizado con éxito.";
                    msg.classList.remove("text-danger");
                    msg.classList.add("text-success");
                } else {
                    const error = await response.text();
                    msg.textContent = "Error al actualizar indicador: " + error;
                    msg.classList.remove("text-success");
                    msg.classList.add("text-danger");
                }
            } catch (error) {
                const msg = document.getElementById("message");
                msg.textContent = "Error de red: " + error.message;
                msg.classList.remove("text-success");
                msg.classList.add("text-danger");
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
