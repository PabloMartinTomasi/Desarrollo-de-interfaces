<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="css/estilo.css" rel="stylesheet">
    <title>Informe indicador</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <img src="img/Logo.png" class="mt-4" alt="Logo EcoData Solutions" width="150" height="50">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Index</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="listarIndicador.html">Indicadores</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <h1 class="centrarTitulo">Informe del indicador</h1>

    <div class="container mt-4">
        <div class="row justify-content-center indicadores"></div>
    </div>

    <script>
        const apiUrl = 'http://localhost:8081/indicadores/todos';

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error('Error al obtener los indicadores');
                return response.json();
            })
            .then(indicadores => {
                const indicador = indicadores.find(ind => ind.id == id);

                const contenedor = document.querySelector('.indicadores');

                if (!indicador) {
                    contenedor.innerHTML = `<p class="text-danger text-center">Indicador no encontrado</p>`;
                    return;
                }

                const divIndicador = document.createElement('div');
                divIndicador.className = 'col-12 d-flex justify-content-center';

                divIndicador.innerHTML = `
                        <div class="card shadow-sm border-success h-100" style="width: 100%; border-radius: 15px;">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title text-center mb-2">Indicador ${indicador.id}</h5>
                                <h6 class="card-subtitle mb-3 text-muted text-center">${indicador.nombre}</h6>

                                <p><span class="badge bg-success me-2">${indicador.tipo}</span>
                                <span class="badge bg-secondary">${indicador.categoria}</span></p>

                                <p><b>Ámbito:</b> ${indicador.ambito}</p>
                                <p style="max-height: 120px; overflow: hidden;">${indicador.descripcion}</p>

                                <p><b>Valor:</b> ${indicador.valor} ${indicador.unidad}</p>
                                <p class="text-end"><small class="text-muted">Fecha: ${indicador.fecha}</small></p>
                                <a href="listarIndicador.html" class="btn btn-primary mt-auto align-self-center">Volver</a>
                            </div>
                        </div>
                    `;

                contenedor.appendChild(divIndicador);
            })
            .catch(error => {
                console.error(error);
                document.querySelector('.indicadores').innerHTML = `<p class="text-danger text-center">No se pudo cargar el indicador</p>`;
            });
    </script>
    <br>
</body>
<footer>
    <p>&copy; 2026 EcoData Solution S.L. Todos los derechos reservados.</p>
</footer>

</html>
