<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="css/estilo.css" rel="stylesheet">
    <title>Informe indicadores</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">EcoData Solution S.L</a>

            <!-- Botón hamburguesa -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item active">
                        <a class="nav-link" href="index.html">Index</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="listarIndicador.html">Indicadores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="informesIndicadores.html">Informe</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <h1 class="centrarTitulo">Informe de indicadores</h1>

    <div class="indicadores row justify-content-center mt-4"></div>

    <script>
        const apiUrl = 'http://localhost:8081/indicadores/todos';

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error al obtener los indicadores');
                }
                return response.json();
            })
            .then(indicadores => {
                const contenedor = document.querySelector('.indicadores');

                indicadores.forEach(indicador => {
                    const divIndicador = document.createElement('div');

                    divIndicador.className = 'col-12 mb-4 d-flex justify-content-center';

                    divIndicador.innerHTML = `
                                    <div class="card shadow h-100">
                                        <div class="card-body">
                                            <h5 class="card-title text-center">
                                                Indicador ${indicador.id}
                                            </h5>

                                            <h6 class="card-subtitle mb-3 text-muted text-center">
                                                ${indicador.nombre}
                                            </h6>

                                            <p><b>Categoría:</b> ${indicador.categoria}</p>
                                            <p><b>Tipo:</b> ${indicador.tipo}</p>
                                            <p><b>Ámbito:</b> ${indicador.ambito}</p>

                                            <p>${indicador.descripcion}</p>

                                            <p><b>Valor:</b> ${indicador.valor} ${indicador.unidad}</p>
                                            <p>Fecha: ${indicador.fecha}</p>
                                        </div>
                                    </div>
                                `;
                    contenedor.appendChild(divIndicador);
                });
            })
            .catch(error => {
                console.error(error);
            });
    </script>


    <br>
</body>
<footer>
    <p>&copy; 2026 EcoData Solution S.L. Todos los derechos reservados.</p>
</footer>

</html>
