<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<html>
  <head>
    <title>Catálogo de Películas</title>
    <style>
                    table { border-collapse: collapse; width: 100%; }
                    th, td { border: 1px solid black; padding: 8px; text-align: center; }
                    th { background-color: #f2f2f2; }
                    img { max-width: 100px; }
                </style>
  </head>
  <body>
    <h2>Catálogo de Películas</h2>
    <table>
      <tr>
        <th>Título</th>
        <th>Género</th>
        <th>Director</th>
        <th>Duración (min)</th>
        <th>Valoración</th>

        <th>Imagen</th>
      </tr>
      <tr>
        <td>Interstellar</td>
        <td>Ciencia ficción</td>
        <td>Christopher Nolan</td>
        <td>169</td>
        <td>8.6</td>
        <td>Sí</td>
        <td>
          <img src="img/Intelestelar.png" alt="Interstellar"/>
        </td>
      </tr>
      <tr>
        <td>The Matrix</td>
        <td>Ciencia ficción</td>
        <td>Lana Wachowski, Lilly Wachowski</td>
        <td>136</td>
        <td>8.7</td>
        <td>Sí</td>
        <td>
          <img src="img/Matrix.png" alt="The Matrix"/>
        </td>
      </tr>
      <tr>
        <td>Kimetsu no Yaiba: Castillo Infinito</td>
        <td>Animación</td>
        <td>Haruo Sotozaki</td>
        <td>155</td>
        <td>8.5</td>
        <td>Sí</td>
        <td>
          <img src="img/KimetsuNoYaiba.png" alt="Kimetsu no Yaiba: Castillo Infinito"/>
        </td>
      </tr>
    </table>
  </body>
</html>
