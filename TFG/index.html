<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="estilo/#.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZwv-model-vue1T"
        crossorigin="anonymous" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="css/estilo.css" rel="stylesheet">
    <title>index</title>
</head>

<body>
    <div>
        <div class="conatiner">
            <div class="row">
                <div class="col col-md-4 col-sm-3 col-xs-12">
                    <p> </p>
                </div>
                <div class="col col-md-6 col-sm-3 col-xs-12">
                    <div class="card" style="width: 30rem;">
                        <div class="card-header">Registro</div>
                        <div class="card-body">
                            <form class="p-4 shadow rounded">
                                <div class="mb-3">
                                    <label for="text" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Nombre" required>
                                </div>
                                <div class="mb-3">
                                    <label for="text" class="form-label">Apellido</label>
                                    <input type="text" class="form-control" id="apellido" placeholder="Apellido"
                                        required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Correo electrónico</label>
                                    <input type="email" class="form-control" id="correoElectronico"
                                        placeholder="ejemplo@gmail.com" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Actividades favoritas</label>
                                    <div class="btn-group d-flex flex-wrap" role="group"
                                        aria-label="Actividades favoritas">
                                        <input type="checkbox" class="btn-check" id="correr"
                                            name="actividadesFavoritas[]" value="correr" autocomplete="off">
                                        <label class="btn btn-outline-primary m-1" for="correr">Correr</label>

                                        <input type="checkbox" class="btn-check" id="vtt" name="actividadesFavoritas[]"
                                            value="VTT" autocomplete="off">
                                        <label class="btn btn-outline-primary m-1" for="vtt">VTT</label>

                                        <input type="checkbox" class="btn-check" id="biciCarretera"
                                            name="actividadesFavoritas[]" value="biciCarretera" autocomplete="off">
                                        <label class="btn btn-outline-primary m-1" for="biciCarretera">Bici de
                                            carretera</label>

                                        <input type="checkbox" class="btn-check" id="senderismo"
                                            name="actividadesFavoritas[]" value="senderismo" autocomplete="off">
                                        <label class="btn btn-outline-primary m-1" for="senderismo">Senderismo</label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <input class="form-check-input" type="checkbox" id="terminosCondiciones" required>
                                    <label class="tetx" for="terminosCondiciones">
                                        He leído y acepto los <a href="#">términos y condiciones</a>
                                    </label>
                                </div>

                                <button type="submit" class="btn btn-primary w-100">Registrarme</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
